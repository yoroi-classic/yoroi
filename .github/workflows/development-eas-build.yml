name: Create development build for devices with EAS
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build for"
        required: true
        type: choice
        options:
          - all
          - ios
          - android
        default: "all"
      branch:
        description: "Branch to build from"
        required: false
        type: string
        default: "develop"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read

jobs:
  development-build:
    # Only allow this workflow to run when triggered from protected branches
    # This prevents malicious workflows from other branches from being executed
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - name: 🔒 Validate workflow trigger branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/develop" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "❌ Error: This workflow can only be triggered from 'develop' or 'main' branches"
            echo "Current branch: ${{ github.ref }}"
            echo "To build from a different branch, trigger this workflow from 'develop' and specify the branch in the 'branch' input parameter"
            exit 1
          fi
          echo "✅ Workflow triggered from authorized branch: ${{ github.ref }}"

      - name: 🏗 Setup repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch || 'develop' }}

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 🔎 Verify mobile toolchain
        working-directory: mobile
        run: npm run check:toolchain

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9.0.0
        with:
          eas-version: 21.0.1
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: 📦 Install Dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: mobile
        run: npm ci

      - name: 🚀 Create development build
        working-directory: mobile
        run: eas build --profile dev-standalone --platform ${{ inputs.platform }} --no-wait --non-interactive
