name: Create production build for Google Play and Testflight with EAS
on:
  pull_request:
    types: [closed]
    branches:
      - production

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  EAS_BUILD_PROFILE: production
  EXPO_PUBLIC_BUILD_VARIANT: PROD

permissions:
  contents: read

jobs:
  production-build:
    if: github.event.pull_request.merged == true
    runs-on: macos-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 🔎 Verify mobile toolchain
        working-directory: mobile
        run: npm run check:toolchain

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9.0.0
        with:
          eas-version: 21.0.1
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: 📦 Install Dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: mobile
        run: npm ci

      - name: 🚀 Create production build
        working-directory: mobile
        env:
          EAS_BUILD_PROFILE: production
          EXPO_PUBLIC_BUILD_VARIANT: PROD
        run: eas build --profile production --platform all --non-interactive

      - name: 🚀 Submit build to Apple TestFlight
        working-directory: mobile
        env:
          EAS_BUILD_PROFILE: production
          EXPO_PUBLIC_BUILD_VARIANT: PROD
        run: eas submit --platform ios --profile production --non-interactive --latest

      - name: 🚀 Submit build to Android Google Play
        working-directory: mobile
        env:
          EAS_BUILD_PROFILE: production
          EXPO_PUBLIC_BUILD_VARIANT: PROD
        run: eas submit --platform android --profile production --non-interactive --latest
