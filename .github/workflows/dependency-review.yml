name: dependency-review

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "package.json"
      - "package-lock.json"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - "scripts/packages/**/package.json"
      - "scripts/packages/**/package-lock.json"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Metro 0.82 and 0.80 use image-size 1.x. The lockfile replaces that
          # package with image-size-next 1.2.2, which fixes both parser DoS
          # advisories while retaining Metro's synchronous API. Dependency
          # Review identifies the npm alias as vulnerable image-size 1.2.2.
          # GHSA-g3hv-75wg-m249's listed affected release, minimatch 10.2.6,
          # is overridden to 11.0.1. The remaining 3.1.5 report is outside
          # the advisory's affected-version list.
          # fast-xml-parser 4.5.7 is listed as a patched release by GHSA-gh4j.
          allow-ghsas: GHSA-w3rx-r6r6-pgpr, GHSA-5p2g-fcmc-qvqq, GHSA-g3hv-75wg-m249, GHSA-gh4j-gqv2-49f6
