name: types-checks

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/types-checks.yml"
      - "mobile/babel.config.js"
      - "mobile/jest.config.js"
      - "mobile/package-lock.json"
      - "mobile/package.json"
      - "mobile/packages/types/**"
      - "scripts/packages/types/**"
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/types-checks.yml"
      - "mobile/babel.config.js"
      - "mobile/jest.config.js"
      - "mobile/package-lock.json"
      - "mobile/package.json"
      - "mobile/packages/types/**"
      - "scripts/packages/types/**"

permissions:
  contents: read

jobs:
  types:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: scripts/packages/types/package-lock.json

      - name: Install types dependencies
        run: npm ci --legacy-peer-deps
        working-directory: scripts/packages/types
        shell: bash

      - name: Build types
        run: npm run build
        working-directory: scripts/packages/types
        shell: bash

      - name: Test types
        run: npm test -- --ci --runInBand
        working-directory: scripts/packages/types
        shell: bash

      - name: Pack types
        run: npm pack --dry-run --ignore-scripts
        working-directory: scripts/packages/types
        shell: bash
