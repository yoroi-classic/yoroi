name: Common Package Checks

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/common-checks.yml"
      - "mobile/packages/common/**"
      - "mobile/packages/logger/**"
      - "mobile/packages/types/**"
      - "scripts/packages/common/**"
      - "scripts/packages/logger/**"
      - "scripts/packages/types/**"
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/common-checks.yml"
      - "mobile/packages/common/**"
      - "mobile/packages/logger/**"
      - "mobile/packages/types/**"
      - "scripts/packages/common/**"
      - "scripts/packages/logger/**"
      - "scripts/packages/types/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  common:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: scripts/packages/common

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: scripts/packages/common/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run tsc

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci --silent

      - name: Build
        run: npm run build:dev

      - name: Pack
        run: npm pack --dry-run --ignore-scripts
