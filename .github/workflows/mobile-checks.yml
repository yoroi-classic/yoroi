name: mobile-checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Verify mobile toolchain
        run: npm run check:toolchain
        working-directory: mobile
        shell: bash
      - name: Install pkgs
        run: npm ci
        working-directory: mobile
        shell: bash
      - name: Test Hermes compiler architecture preflight
        run: npm run test:hermesc-architecture
        working-directory: mobile
        shell: bash
      - name: Lint Hermes compiler architecture preflight
        run: npm run lint:hermesc-architecture
        working-directory: mobile
        shell: bash
      - name: Verify Hermes compiler architecture
        run: npm run check:hermesc
        working-directory: mobile
        shell: bash
      - name: Test mobile fixture safety
        run: npm run lint:mobile-fixture-safety && npm run test:mobile-fixture-safety
        working-directory: mobile
        shell: bash
      - name: Scan generated production Hermes artifacts for fixtures
        run: npm run verify:production-fixture-artifacts
        working-directory: mobile
        shell: bash
      - name: TypeScript check
        run: npm run tsc
        working-directory: mobile
        shell: bash
      - name: Lint
        run: npm run lint
        working-directory: mobile
        shell: bash
      - name: Test
        run: npm run test
        working-directory: mobile
        shell: bash
      - name: Dependency smoke tests
        run: npm run test:mobile-deps-smoke
        working-directory: mobile
        shell: bash
      - name: Cardano wallet backend smoke unit tests
        run: npm run test:cardano-wallet-backend-smoke:unit
        working-directory: mobile
        shell: bash
      - name: Lint Cardano wallet backend smoke
        run: npm run lint:cardano-wallet-backend-smoke
        working-directory: mobile
        shell: bash
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          files: |
            mobile/coverage/lcov.info
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  android-native-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: 1.86.0
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          {
            echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/27.0.12077973"
            echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973"
            echo "ANDROID_NDK=${ANDROID_HOME}/ndk/27.0.12077973"
          } >> "$GITHUB_ENV"
      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile
      - name: Test CML bridge Rust vectors
        run: cargo test --manifest-path node_modules/@yoroi-classic/cml-mobile-bridge/rust/Cargo.toml
        working-directory: mobile
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: mobile
      - name: Build CML and MSL Rust libraries
        run: EAS_BUILD_PLATFORM=android bash ./scripts/eas-post-install.sh
        working-directory: mobile
      - name: Compile Android app and native modules
        run: ./gradlew :app:assembleDebug
        working-directory: mobile/android
