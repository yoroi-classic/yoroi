name: mobile-checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Verify mobile toolchain
        run: npm run check:toolchain
        working-directory: mobile
        shell: bash
      - name: Install pkgs
        run: npm ci
        working-directory: mobile
        shell: bash
      - name: Test Hermes compiler architecture preflight
        run: npm run test:hermesc-architecture
        working-directory: mobile
        shell: bash
      - name: Lint Hermes compiler architecture preflight
        run: npm run lint:hermesc-architecture
        working-directory: mobile
        shell: bash
      - name: Verify Hermes compiler architecture
        run: npm run check:hermesc
        working-directory: mobile
        shell: bash
      - name: TypeScript check
        run: npm run tsc
        working-directory: mobile
        shell: bash
      - name: Lint
        run: npm run lint
        working-directory: mobile
        shell: bash
      - name: Test
        run: npm run test
        working-directory: mobile
        shell: bash
      - name: Dependency smoke tests
        run: npm run test:mobile-deps-smoke
        working-directory: mobile
        shell: bash
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          files: |
            mobile/coverage/lcov.info
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
