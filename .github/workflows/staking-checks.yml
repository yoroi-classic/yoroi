name: staking-checks

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/staking-checks.yml"
      - "scripts/packages/staking/**"
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/staking-checks.yml"
      - "scripts/packages/staking/**"

permissions:
  contents: read

jobs:
  staking:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/mobile-package-check
        with:
          package-name: staking
          package-directory: scripts/packages/staking
          cache-dependency-path: scripts/packages/staking/package-lock.json
