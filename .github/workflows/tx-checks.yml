name: tx-checks

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/tx-checks.yml"
      - "scripts/packages/tx/**"
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/tx-checks.yml"
      - "scripts/packages/tx/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tx:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/mobile-package-check
        with:
          package-name: tx
          package-directory: scripts/packages/tx
          cache-dependency-path: scripts/packages/tx/package-lock.json
