name: api-checks

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/actions/mobile-package-check/action.yml"
      - ".github/workflows/api-checks.yml"
      - "mobile/babel.config.js"
      - "mobile/jest.config.js"
      - "mobile/package-lock.json"
      - "mobile/package.json"
      - "mobile/packages/api/**"
      - "scripts/packages/api/**"
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/actions/mobile-package-check/action.yml"
      - ".github/workflows/api-checks.yml"
      - "mobile/babel.config.js"
      - "mobile/jest.config.js"
      - "mobile/package-lock.json"
      - "mobile/package.json"
      - "mobile/packages/api/**"
      - "scripts/packages/api/**"

permissions:
  contents: read

jobs:
  api:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/mobile-package-check
        with:
          package-name: api
          package-directory: scripts/packages/api
          cache-dependency-path: |
            mobile/package-lock.json
            scripts/packages/api/package-lock.json
          install-mobile: "true"
          mobile-test-path: packages/api
