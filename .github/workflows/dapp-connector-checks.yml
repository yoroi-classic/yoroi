name: dapp-connector-checks

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/dapp-connector-checks.yml"
      - "scripts/packages/dapp-connector/**"
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/dapp-connector-checks.yml"
      - "scripts/packages/dapp-connector/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dapp-connector:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: scripts/packages/dapp-connector/package-lock.json

      - name: Validate dapp-connector package lock
        run: npm ci --legacy-peer-deps
        working-directory: scripts/packages/dapp-connector
        shell: bash
