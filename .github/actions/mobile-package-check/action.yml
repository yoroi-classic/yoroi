name: Mobile package check
description: Validate a standalone package lock and optionally test its mobile package

inputs:
  package-name:
    description: Package name used in step labels
    required: true
  package-directory:
    description: Standalone package directory containing package-lock.json
    required: true
  cache-dependency-path:
    description: Lockfiles used for the npm cache key
    required: true
  install-mobile:
    description: Whether to install the mobile dependencies
    required: false
    default: "false"
  mobile-test-path:
    description: Mobile Jest path to test; leave empty to skip Jest
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "22.12.0"
        cache: "npm"
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Validate ${{ inputs.package-name }} package lock
      run: npm ci --legacy-peer-deps
      working-directory: ${{ inputs.package-directory }}
      shell: bash

    - name: Install mobile dependencies
      if: inputs.install-mobile == 'true'
      run: npm ci
      working-directory: mobile
      shell: bash

    - name: Test ${{ inputs.package-name }}
      if: inputs.mobile-test-path != ''
      run: npx jest --config jest.config.js "${{ inputs.mobile-test-path }}" --runInBand --coverage=false
      working-directory: mobile
      shell: bash
